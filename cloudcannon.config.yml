# CloudCannon configuration for the Lakeland Graphics static HTML site
# Docs: https://cloudcannon.com/documentation/
source: /
# Plain HTML, no build step — CloudCannon serves the files as-is.
ssg: static
collections_config:
  pages:
    path: ""
    glob:
      - "*.html"
    name: Pages
    icon: description
    # Force the Visual Editor for these plain-HTML pages. Without this,
    # CloudCannon defaults to the Content/Data editor, which can't parse a
    # front-matter-less HTML document and shows "Unsupported data".
    # (The Source editor stays available; it can't be disabled by this key.)
    _enabled_editors:
      - visual
# Toolbar for editable rich-text regions. In headlines, Bold applies the accent
# colour (see the bold=accent rule in assets/styles.css) — that's how an editor
# highlights a word. `block` covers on-page class="editable" regions (Visual
# Editor); `content` covers rich text from file content sections.
_editables:
  block:
    bold: true
    italic: true
    link: true
    undo: true
    redo: true
    removeformat: true
  content:
    bold: true
    italic: true
    link: true
    undo: true
    redo: true
    removeformat: true
_inputs:
  # Friendly labels for the per-page SEO fields exposed to editors
  description:
    type: text
    comment: The search-result / social description for this page (~155 chars).
